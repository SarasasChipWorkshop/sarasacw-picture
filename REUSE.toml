version = 1
SPDX-PackageName = "sarasacw-picture"
SPDX-PackageDownloadLocation = "https://github.com/SarasasChipWorkshop/sarasacw-picture.git"

[[annotations]]
path = [".gitattributes", ".git-blame-ignore-revs", ".gitignore", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["README**.md", "NEWS", "assets/**.qrc"]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 BLumia", "2026 Sarasa's Chip Workshop"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["app/**.ui"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sarasa's Chip Workshop"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["assets/htmls/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Gary Wang", "2026 Sarasa's Chip Workshop"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["assets/icons/**.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sarasa's Chip Workshop"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["dist/**.liquid", "dist/**.toml", "dist/**.ps1"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sarasa's Chip Workshop"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["dist/**.png", "dist/**.ico", "dist/**.icns"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sarasa's Chip Workshop"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["locales/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Translators from hosted.weblate.org"
SPDX-License-Identifier = "MIT"
